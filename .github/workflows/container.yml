name: Publish container

on:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Also update the latest image tag"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate source
        shell: bash
        run: |
          set -eu
          test -z "$(gofmt -l internal cmd)"
          go vet -mod=vendor ./...
          go test -mod=vendor ./...

      - name: Log in to GHCR
        shell: bash
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$CR_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish versioned image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -eu
          image="${IMAGE,,}"
          version="sha-${GITHUB_SHA:0:7}"
          docker build --tag "$image:$version" .
          docker push "$image:$version"
          if [ "${PUBLISH_LATEST:-true}" = "true" ]; then
            docker tag "$image:$version" "$image:latest"
            docker push "$image:latest"
          fi
